<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>GoldenCatMarket</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <img src="imagenes/goldencat.jpg" alt="logo" width="40" class="d-inline-block align-text-top">
                GoldenCatMarket
            </a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="#">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Juegos</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Ofertas</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Contacto</a></li>
                </ul>
            </div>
            <div class="cart">
                <a href="#"><img src="imagenes/istockphoto-1206806317-612x612.jpg" alt="Carrito" width="30"></a>
            </div>
        </div>
    </nav>

    <!-- Carrusel -->
    <div id="carouselExample" class="carousel slide mt-3">
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="imagenes/djg4d1m-9ac6075f-3922-4301-8ec4-7c83e270d964.png" class="d-block w-100" alt="...">
            </div>
            <div class="carousel-item">
                <img src="imagenes/hollow k.jpg" class="d-block w-100" alt="...">
            </div>
            <div class="carousel-item">
                <img src="imagenes/devil-may-cry-5-4318.jpg" class="d-block w-100" alt="...">
            </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Previous</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Next</span>
        </button>
    </div>

    <!-- Contenedor de productos (dinámico) -->
    <div class="container text-center mt-4">
        <div id="productos-container" class="row justify-content-center"></div>
    </div>

    <!-- Contenedor del carrito -->
    <div id="carrito-container" class="carrito-panel"></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>

</body>
</html>
